[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-XSS-Protection = "0"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/k/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"

[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"

[[headers]]
  for = "/guides/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"

[[headers]]
  for = "/about"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"

[[headers]]
  for = "/contact"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"

[[headers]]
  for = "/legal/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# --- Redirect rules ---
# Trailing slash removal is handled by Next.js (trailingSlash: false in next.config.mjs)
# in static export mode. Only add redirects here for paths NOT managed by Next.js.

[[redirects]]
  from = "/api/indexing/google"
  to = "/api/google-indexing"
  status = 308

[[redirects]]
  from = "/api/indexing/google/webhook"
  to = "/api/google-indexing/webhook"
  status = 308
