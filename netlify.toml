[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-XSS-Protection = "0"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# --- Redirect rules ---
# Trailing slash removal is handled by Next.js (trailingSlash: false in next.config.mjs)
# in static export mode. Only add redirects here for paths NOT managed by Next.js.

[[redirects]]
  from = "/api/indexing/google"
  to = "/api/google-indexing"
  status = 301

[[redirects]]
  from = "/api/indexing/google/webhook"
  to = "/api/google-indexing/webhook"
  status = 301
