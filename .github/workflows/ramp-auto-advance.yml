name: Ramp Auto-Advance
# Full 20M corpus is locked. This workflow no longer advances or contracts a
# staged sitemap band. It only verifies edge sitemap ↔ .ramp-level = 5.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  confirm-full-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Confirm sitemap advertises all 20M
        run: |
          LEVEL=$(tr -d '[:space:]' < .ramp-level)
          echo "ramp-level=$LEVEL"
          if [ "$LEVEL" != "5" ]; then
            echo "Sitemap band lock is 5 (full 20M). Found $LEVEL."
            exit 1
          fi
          node --import tsx scripts/verify-ramp-sitemap-sync.mjs
